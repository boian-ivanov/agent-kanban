  /api/tasks/{task_id}/log/stream:
    get:
      summary: Stream Task Log
      description: 'SSE endpoint: streams the agent log file for a task.


        Sends existing content immediately, then polls for new lines every 500ms.

        Closes when the log file is deleted (agent cleanup) or the client disconnects.'
      operationId: stream_task_log_api_tasks__task_id__log_stream_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
