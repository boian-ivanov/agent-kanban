          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Project Api Projects Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
