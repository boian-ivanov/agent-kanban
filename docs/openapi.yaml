  /api/tasks:
    get:
      summary: List Tasks Api
      description: 'Filterable task list (summary cards), sorted by status/column_order.


        Replaces per-task fetching for agents: project/status/assignee/parent_id

        and last-updated filters in a single request.'
      operationId: list_tasks_api_api_tasks_get
      parameters:
      - name: project
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: project_id filter
          title: Project
        description: project_id filter
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: status filter
          title: Status
        description: status filter
      - name: assignee
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: assignee filter
          title: Assignee
        description: assignee filter
      - name: parent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: parent_id filter
          title: Parent Id
        description: parent_id filter
      - name: updated_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO8601 — only tasks with a history entry at or after this
            timestamp
          title: Updated Since
        description: ISO8601 — only tasks with a history entry at or after this timestamp
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Tasks Api Api Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Task
      operationId: create_task_api_tasks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Task Api Tasks Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}:
    get:
      summary: Get Task
      operationId: get_task_api_tasks__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: since_seq
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: only return history/comments rows with id > since_seq (agent
            driver comment poll)
          title: Since Seq
        description: only return history/comments rows with id > since_seq (agent
          driver comment poll)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Task Api Tasks  Task Id  Get
        '422':
