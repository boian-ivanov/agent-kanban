  /api/system/claude-auth-login:
    post:
      summary: Claude Auth Login
      description: 'Runs ``claude auth login --claudeai`` in the background.


        The command opens the OAuth flow in a browser on its own. This endpoint

        does not wait for completion — it returns immediately. After a successful

        login the user sees the refreshed state by polling

        /api/system/claude-auth-status.'
      operationId: claude_auth_login_api_system_claude_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Claude Auth Login Api System Claude Auth Login Post
  /api/system/pick-folder:
    post:
      summary: Pick Folder
      description: 'Opens a native folder picker dialog (macOS / Linux+zenity / Windows).


        Returns ``{"path": "/abs/path"}`` or ``{"path": null, "cancelled": true}``

        when the user clicks Cancel. When no picker is available on the platform —
        501.'
      operationId: pick_folder_api_system_pick_folder_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Pick Folder Api System Pick Folder Post
  /api/system/pick-file:
    post:
      summary: Pick File
      description: Opens a native file picker dialog. macOS only for now.
      operationId: pick_file_api_system_pick_file_post
      parameters:
      - name: default_location
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Default Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Pick File Api System Pick File Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentSteerRequest:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: user message injected into the live session
      type: object
      required:
      - text
      title: AgentSteerRequest
    AgentStopRequest:
      properties:
        reason:
          type: string
          title: Reason
          description: stop reason, recorded as the task comment
        to_status:
          type: string
          title: To Status
          description: 'post-stop task status (D2): ''blocked'' for human intervention
            (default), ''approved'' for a routine auto-retry'
          default: blocked
      type: object
      required:
      - reason
      title: AgentStopRequest
    AssignRequest:
      properties:
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
      type: object
      title: AssignRequest
    ChatMessageRequest:
      properties:
        role:
          type: string
          title: Role
          description: author, e.g. agent:fe / user
        content:
          type: string
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessageRequest
    ClaimRequest:
      properties:
        assignee:
          type: string
          title: Assignee
          description: claiming agent, e.g. agent:fe
      type: object
      required:
      - assignee
      title: ClaimRequest
    CommentRequest:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: CommentRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkRequest:
      properties:
        type:
          type: string
          title: Type
        value:
          type: string
          title: Value
      type: object
      required:
      - type
      - value
      title: LinkRequest
    MoveRequest:
      properties:
        to_status:
          type: string
          title: To Status
        column_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Column Order
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - to_status
      title: MoveRequest
    ProjectArchiveRequest:
      properties:
        archived:
          type: boolean
          title: Archived
          default: true
      type: object
      title: ProjectArchiveRequest
    ProjectCreate:
      properties:
        id:
          type: string
          title: Id
          description: 'slug: lowercase, a-z 0-9 -, 2-32 chars'
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
          default: '#F10D30'
        icon:
          type: string
          title: Icon
          default: ''
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: ticket id prefix, uppercase 1-4 chars (e.g. AK, SP); None =
            legacy T-### ids
      type: object
      required:
      - id
      - name
      title: ProjectCreate
    ProjectUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        code:
