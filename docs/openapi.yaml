  /api/tasks/{task_id}/agent/stop:
    post:
      summary: Agent Stop
      description: 'Relay a stop to the task''s live agent driver.


        The driver SIGINTs the omp session, posts the reason as a comment and

        moves the task (blocked for human intervention / approved for a routine

        auto-retry — D2). 409 when no live run is registered.'
      operationId: agent_stop_api_tasks__task_id__agent_stop_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStopRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Stop Api Tasks  Task Id  Agent Stop Post
