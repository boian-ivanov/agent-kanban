  /api/tasks/{task_id}/claim:
    post:
      summary: Claim Task
      description: 'Atomic claim: assignee=agent:<role> + approved → in_progress.


        History-recorded; idempotent for a re-claim by the same assignee.

        Emits task_moved so the board/SSE stay current.'
      operationId: claim_task_api_tasks__task_id__claim_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
