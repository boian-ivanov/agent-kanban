openapi: 3.1.0
info:
  title: Kanban
  version: '2.0'
paths:
  /:
    get:
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /p/{project_id}:
    get:
      summary: Index For Project
      description: 'SPA-style: same HTML, the frontend reads project_id from location.pathname.'
      operationId: index_for_project_p__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/board:
    get:
      summary: Get Board
      description: 'Board grouped by status.


        ``include=full`` returns full card payloads (description, acceptance,

        comments, ancestors, parent_id, ...) for every task instead of the

        compact summary fields.'
      operationId: get_board_api_board_get
      parameters:
      - name: project
        in: query
        required: false
        schema:
          type: string
          description: project_id
          default: default
          title: Project
        description: project_id
      - name: include
        in: query
        required: false
        schema:
          type: string
          description: summary|full — full returns the complete card payload
          default: summary
          title: Include
        description: summary|full — full returns the complete card payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Board Api Board Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects:
    get:
      summary: List Projects
      operationId: list_projects_api_projects_get
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Projects Api Projects Get
        '422':
